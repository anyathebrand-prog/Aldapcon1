# ALDAPCON Platform — local environment
#
# TRD §1.1: one server, one application, PostgreSQL and Redis alongside it.
# This file mirrors that topology rather than inventing a distributed one for
# local work, so what is debugged here is what runs in Lagos.
#
# Five services because Phase 1's completion criteria require proving the queue
# worker and the scheduler independently (plan Phase 1, tests 2 and 3). Running
# them inside the web container would leave both unverified until Phase 7,
# where the failure would present as "emails never send".

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aldapcon/app:local
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aldapcon}
      POSTGRES_USER: ${DB_USERNAME:-aldapcon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      # Nigerian names must survive export to Excel (AC-F9). The database is
      # UTF-8 from the first byte written, never retrofitted.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Bound to loopback only. TRD §6.2 keeps Postgres off the public
      # interface; the same habit locally costs nothing.
      - "127.0.0.1:${DB_PORT_HOST:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-aldapcon} -d ${DB_DATABASE:-aldapcon}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_PORT_HOST:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Separate process, per TRD §1.1 (supervisor in production). A failed
  # activation job is a paid member with no membership (Schema §8.4), so the
  # worker is never an afterthought bolted onto the web container.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: aldapcon/app:local
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --backoff=5 --max-time=3600
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # cron in production (TRD §10). The lifecycle transitions and renewal
  # reminders in Phase 11 depend entirely on this running.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: aldapcon/app:local
    restart: unless-stopped
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Local only. Nothing leaves the machine (TRD §9). Phase 7 replaces this with
  # a real provider once B-5 is answered.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  pgdata:
  redisdata:
