# ALDAPCON Platform — continuous integration
#
# Plan §2, rule 10: Pint, PHPStan and Pest must pass before a phase is called
# complete. Plan Phase 1: CI runs on push and blocks merge on failure.
#
# The service versions here match TRD §14 exactly. CI passing against a
# different PostgreSQL than production runs is a test that proves nothing.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aldapcon_test
          POSTGRES_USER: aldapcon
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U aldapcon -d aldapcon_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: aldapcon_test
      # Not the container superuser. See "Create the unprivileged application
      # role" below — FR-9.8 is unverifiable as a superuser.
      DB_USERNAME: aldapcon_app
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, intl, zip, gd, bcmath, pcntl
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # TRD §6.1 — dependency scanning. A known-vulnerable package in a
      # payment application is not a warning, it is a defect.
      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Check formatting (Pint)
        run: ./vendor/bin/pint --test

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --no-progress

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Create the test database
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U aldapcon -d postgres \
            -c "CREATE DATABASE aldapcon_test" || true

      # The application must NOT connect as a superuser (TRD §6.2), and the
      # audit log's append-only guarantee (FR-9.8) depends on that: a
      # superuser bypasses grant checks entirely, so the REVOKE would protect
      # nothing and its tests would skip rather than prove anything.
      #
      # The postgres service's own role is the container superuser, so a
      # separate unprivileged role is created here and used for migrations and
      # tests. citext and pgcrypto are trusted extensions in PostgreSQL 16, so
      # a non-superuser with CREATE on the database can still install them.
      - name: Create the unprivileged application role
        run: |
          PGPASSWORD=secret psql -h 127.0.0.1 -U aldapcon -d aldapcon_test -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS aldapcon_app;
          CREATE ROLE aldapcon_app LOGIN PASSWORD 'secret';
          GRANT ALL ON SCHEMA public TO aldapcon_app;
          GRANT ALL ON DATABASE aldapcon_test TO aldapcon_app;
          SQL
          PGPASSWORD=secret psql -h 127.0.0.1 -U aldapcon_app -d aldapcon_test \
            -c "SELECT current_user, usesuper FROM pg_user WHERE usename = current_user"

      - name: Run migrations
        run: php artisan migrate --no-interaction --force

      - name: Run tests (Pest)
        run: php artisan test

      # Plan §2 lists axe-core in GitHub Actions as Phase 2 verification
      # tooling. Running it here removes the browser-extension step from the
      # manual checklist and, more importantly, stops an accessibility
      # regression depending on somebody remembering to scan.
      #
      # Automated tooling catches roughly a third of real WCAG issues (UI brief
      # §10). The remaining two thirds — whether a focus ring is visible
      # against real content, whether the mobile menu genuinely traps focus —
      # still need a person. This does not replace that pass; it removes the
      # part that never needed one.
      #
      # The gallery is scanned because it renders every component in every
      # state, which is the broadest single target available.
      - name: Start the application
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/_gallery > /dev/null && break
            sleep 1
          done
          curl -sf -o /dev/null -w "gallery: HTTP %{http_code}\n" http://127.0.0.1:8000/_gallery

      - name: Accessibility scan (axe-core)
        run: |
          npx --yes @axe-core/cli@4 \
            http://127.0.0.1:8000/_gallery \
            http://127.0.0.1:8000/ \
            --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
            --exit
