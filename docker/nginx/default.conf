# ALDAPCON Platform — nginx site configuration (local / staging shape)
#
# Production adds TLS termination, HSTS and rate limiting on the auth, payment
# and webhook paths (TRD §6.1, §6.2). Those belong to Phase 16 and Phase 17;
# this file is the minimum that serves the application correctly.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # PRD FR-3.6 caps uploads at 8 MB. Kept above that so the application
    # returns the validation message rather than nginx returning a bare 413.
    client_max_body_size 12M;

    # TRD §6.1 — do not advertise the server version.
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        # Paystack webhook verification calls out to the gateway before it
        # answers (TRD §4.1 step 6). The default 60s is enough, but a timeout
        # here would look like a lost payment, so it is set explicitly.
        fastcgi_read_timeout 60s;
    }

    # Nothing under storage/app/private is ever served directly. Certificates
    # and receipts are streamed by a controller after a policy check
    # (Schema §6.1, FR-3.13.2). Belt and braces alongside the fact that the
    # document root is public/ and those files live outside it.
    location ~ ^/(storage/app|\.env|\.git) {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
