; ALDAPCON Platform — PHP configuration
; Values here are the ones a requirement depends on. Anything not listed keeps
; the PHP default deliberately, so there is less to reason about at 2am.

memory_limit = 256M

; PRD FR-3.6 caps certificate uploads at 8 MB. These sit above that so the
; application's own validation produces the error message, not the web server —
; a bare 413 from nginx or PHP gives the applicant no next step (App Flow §5).
upload_max_filesize = 12M
post_max_size = 16M
max_file_uploads = 5

max_execution_time = 60

; Schema §1.4: all timestamps stored UTC, rendered Africa/Lagos.
date.timezone = UTC

; TRD §6.1 — do not advertise the PHP version.
expose_php = Off

; Errors go to the log, never to the response body. APP_DEBUG=false in
; production is a launch gate (TRD §9); this is the backstop underneath it.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Session cookies are issued by Laravel (TRD §2.3), not by PHP's own handler.
session.cookie_httponly = 1
session.cookie_secure = 0
session.cookie_samesite = Lax
